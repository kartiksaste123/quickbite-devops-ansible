---
- name: Install python packages
  ansible.builtin.apt:
    name: "{{ app_packages }}"
    state: present

- name: Create app user
  ansible.builtin.user:
    name: "{{ app_user }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Create app directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0755"
  loop:
    - "{{ app_dir }}"
    - "{{ app_config_dir }}"

- name: Copy application code
  ansible.builtin.copy:
    src: quickbite/
    dest: "{{ app_dir }}/"
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0644"
  notify: Restart quickbite

- name: Install python requirements in a virtualenv
  ansible.builtin.pip:
    requirements: "{{ app_dir }}/requirements.txt"
    virtualenv: "{{ app_venv }}"
    virtualenv_command: python3 -m venv
  notify: Restart quickbite

- name: Write environment file
  ansible.builtin.template:
    src: quickbite.env.j2
    dest: "{{ app_config_dir }}/quickbite.env"
    owner: root
    group: "{{ app_user }}"
    mode: "0640"
  notify: Restart quickbite

- name: Install systemd service
  ansible.builtin.template:
    src: quickbite.service.j2
    dest: "/etc/systemd/system/{{ app_service_name }}.service"
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart quickbite

- name: Start and enable QuickBite service
  ansible.builtin.systemd_service:
    name: "{{ app_service_name }}"
    state: started
    enabled: true
    daemon_reload: true

- name: Wait for the app port
  ansible.builtin.wait_for:
    port: "{{ app_port }}"
    timeout: 30
