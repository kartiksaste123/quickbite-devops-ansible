---
- name: Install nginx
  ansible.builtin.apt:
    name: nginx
    state: present

- name: Set worker connections in nginx.conf
  ansible.builtin.lineinfile:
    path: /etc/nginx/nginx.conf
    regexp: '^\s*worker_connections'
    line: "        worker_connections {{ nginx_worker_connections }};"
  notify: Reload nginx

- name: Deploy QuickBite site config
  ansible.builtin.template:
    src: quickbite.conf.j2
    dest: "/etc/nginx/sites-available/{{ nginx_site_name }}.conf"
    owner: root
    group: root
    mode: "0644"
  notify: Reload nginx

- name: Enable QuickBite site
  ansible.builtin.file:
    src: "/etc/nginx/sites-available/{{ nginx_site_name }}.conf"
    dest: "/etc/nginx/sites-enabled/{{ nginx_site_name }}.conf"
    state: link
  notify: Reload nginx

- name: Remove default site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx

- name: Check nginx config
  ansible.builtin.command: nginx -t
  changed_when: false

- name: Start and enable nginx
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true
