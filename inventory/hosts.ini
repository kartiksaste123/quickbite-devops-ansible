# QuickBite food delivery - staging inventory
# The 3 servers are Ubuntu 22.04 containers started by lab/start_lab.sh,
# each one exposes ssh on a different port of the control node.

[webservers]
web01 ansible_host=127.0.0.1 ansible_port=2221 http_port_public=8088

[appservers]
app01 ansible_host=127.0.0.1 ansible_port=2222

[dbservers]
db01 ansible_host=127.0.0.1 ansible_port=2223

# parent group with every server of the application
[foodapp:children]
webservers
appservers
dbservers

[foodapp:vars]
env_name=staging
